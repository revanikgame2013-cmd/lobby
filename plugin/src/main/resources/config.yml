# Максимум игроков в лобби
max-players: 16
# Максимум маньяков в одной игре
max-maniacs: 1
# Минимум готовых игроков, чтобы лидер мог начать (для теста можно поставить 1)
min-ready: 2
# Выдавать предмет "Играть" (компас) в 9-й слот при входе
give-play-item: true
# Телепортировать игроков и ставить режим выживания при старте
default-start-behaviour: true
